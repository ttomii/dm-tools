[workspace]
members = ["crates/dm-parser", "crates/dm-converter"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["TOMII, Tatsuru"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
flate2 = "1.1"
geo = { version = "0.32", default-features = false }
pmtiles = { version = "0.23", default-features = false, features = ["write"] }
proj4rs = "0.1"
prost = "0.14"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
