<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DM MapLibre Preview</title>
  <link rel="stylesheet" href="./vendor/maplibre-gl.css">
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body>
  <header>
    <strong>DM MapLibre Preview</strong>
    <select id="style"></select>
    <button id="background" type="button">Background</button>
    <label class="layer-toggle"><input type="checkbox" id="dm" checked> DM地物</label>
    <label class="layer-toggle"><input type="checkbox" id="basemap" checked> 地理院地図(淡色)</label>
    <span id="status">Loading...</span>
  </header>
  <main id="map"></main>
  <aside id="sidebar">
    <section id="feature-list-panel">
      <div class="panel-heading">
        <div class="feature-list-controls">
          <input id="feature-layer-filter" type="search" aria-label="レイヤを検索" placeholder="レイヤを検索">
          <select id="feature-kind" aria-label="図形種別">
            <option value="">すべて</option>
            <option value="point">点</option>
            <option value="line">線</option>
            <option value="polygon">面</option>
            <option value="text">注記</option>
          </select>
          <select id="feature-layer" aria-label="レイヤ"></select>
        </div>
      </div>
      <div id="feature-list-status"></div>
      <ol id="feature-list"></ol>
      <div id="feature-list-pager">
        <button id="feature-prev" type="button">前へ</button>
        <span id="feature-page"></span>
        <button id="feature-next" type="button">次へ</button>
      </div>
    </section>
    <section id="detail-panel">
      <div id="detail-tabs" role="tablist" aria-label="表示切り替え">
        <button id="tab-style-editor" type="button" role="tab" aria-selected="true">スタイル編集</button>
        <button id="tab-feature-details" type="button" role="tab" aria-selected="false">地物プロパティ</button>
      </div>
      <section id="style-editor" class="detail-tab-panel">
        <div class="panel-heading">
          <strong>スタイル編集</strong>
          <button id="style-save" type="button" disabled>保存</button>
        </div>
        <div id="style-editor-status">読み込み中...</div>
        <div class="style-editor-controls">
          <div class="style-kind-controls" aria-label="種別ごとの色変更">
            <label>アイコン <input type="color" id="style-kind-icon" value="#000000"></label>
            <label>ライン <input type="color" id="style-kind-line" value="#000000"></label>
            <label>ポリゴン <input type="color" id="style-kind-polygon" value="#000000"></label>
            <label>テキスト <input type="color" id="style-kind-text" value="#000000"></label>
          </div>
          <div class="style-layer-controls">
            <select id="style-layer" aria-label="編集レイヤ"></select>
            <label class="layer-toggle"><input type="checkbox" id="style-layer-visible" checked> 表示</label>
            <input type="color" id="style-layer-color" value="#000000" aria-label="レイヤ色">
          </div>
          <label class="style-option-toggle"><input type="checkbox" id="style-vertical-long-sound"> 縦書き長音を縦棒表示</label>
        </div>
      </section>
      <section id="feature-details" class="detail-tab-panel" hidden>
        <div id="hit-results">
          <div id="hit-list-status">クリックした位置の重なり</div>
          <ol id="hit-list"></ol>
        </div>
        <pre id="properties"></pre>
      </section>
    </section>
  </aside>
  <script src="./vendor/maplibre-gl.js"></script>
  <script src="./vendor/pmtiles.js"></script>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
